server {
    listen       80;
    server_name  _;

    # ── Static frontend files ──────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # Serve index.html for any unknown path (SPA-friendly)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API calls to Spring Boot backend ─────────────────────────────────
    # When running locally: backend runs at localhost:8080
    # In Docker Compose:    backend service name resolves via DNS
    # In Kubernetes:        backend Service DNS  (service-name.namespace.svc.cluster.local)
    #
    # K8s teaching point:
    #   The BACKEND_URL below is a placeholder.
    #   In the Dockerfile we use envsubst to inject the real value at container start.
    #   This means: same image, different behaviour based on ConfigMap value.

    location /api/ {
        proxy_pass         http://stockapp-backend-service:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass         http://stockapp-backend-service:8080;
        proxy_set_header   Host $host;
    }

    location /ready {
        proxy_pass         http://stockapp-backend-service:8080;
        proxy_set_header   Host $host;
    }

    # ── WebSocket upgrade ──────────────────────────────────────────────────────
    # SockJS uses /ws/... paths. The Upgrade + Connection headers must be
    # forwarded or the WebSocket handshake fails silently (falls back to polling).
    #
    # K8s teaching point:
    #   The Ingress needs the same headers — students add these annotations:
    #     nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    #     nginx.ingress.kubernetes.io/configuration-snippet: |
    #       proxy_set_header Upgrade $http_upgrade;
    #       proxy_set_header Connection "upgrade";
    location /ws {
        proxy_pass         http://stockapp-backend-service:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
